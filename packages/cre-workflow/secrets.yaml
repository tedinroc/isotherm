secretsNames:
  # EIP-712 attester key (must be Resolver.attester(), live: 0x63D2523dDC4BB055A19682Bf2d61fe94959D0Bb9).
  # In simulation the value comes from this env var (scripts/run-official.sh reads ~/.config/isotherm/attester.key).
  # For the DON (target testnet-don) the same name is uploaded once to the Vault DON by the owner, in their own
  # terminal: `cre secrets create secrets.yaml -T testnet-don --secrets-auth=browser` (DON-CUTOVER.md, step C1).
  # This file only ever holds names, never values.
  ISOTHERM_ATTESTER_KEY:
    - ISOTHERM_ATTESTER_KEY_ALL
