# Isotherm settlement workflow: per-target settings.
#   anvil-fork : simulate --broadcast against a local `anvil --fork-url https://testnet-rpc.monad.xyz` (no MON spent)
#   testnet    : simulate --broadcast against live Monad testnet 10143 (CRE_ETH_PRIVATE_KEY pays ~0.02 MON per report)
# The anvil fork keeps the live v1 addresses, so both configs point at the same Resolver / Vault.
anvil-fork:
  user-workflow:
    workflow-name: "isotherm-settle"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.anvil.json"
    secrets-path: "../secrets.yaml"

testnet:
  user-workflow:
    workflow-name: "isotherm-settle"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.testnet.json"
    secrets-path: "../secrets.yaml"
