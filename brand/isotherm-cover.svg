<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t">
  <title id="t">Isotherm: daily city-temperature strike ladders (testnet prototype)</title>
  <!-- 16:9 cover for the demo and pitch videos. Original artwork (MIT, see LICENSE); no third-party marks.
       Text uses system fonts (Avenir Next, then Helvetica Neue / Arial); brand/isotherm-cover-1920x1080.png is
       the rendered file to use. -->
  <defs>
    <linearGradient id="c-cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173B5C"/>
      <stop offset="1" stop-color="#0B1D30"/>
    </linearGradient>
    <linearGradient id="c-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#F0502B"/>
    </linearGradient>
    <linearGradient id="m-cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173B5C"/>
      <stop offset="1" stop-color="#0C2034"/>
    </linearGradient>
    <linearGradient id="m-warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#F0502B"/>
    </linearGradient>
    <clipPath id="m-tile">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- sky with faint isotherm contours -->
  <rect width="1920" height="1080" fill="url(#c-cool)"/>
  <g fill="none" stroke="#25547D" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M-20 100 C420 20 760 160 1180 120 S1700 40 1940 80"/>
    <path d="M-20 205 C420 125 760 265 1180 225 S1700 145 1940 185"/>
  </g>
  <!-- warm field below the main isotherm -->
  <path d="M-20 870 C420 790 760 930 1180 890 S1700 810 1940 850 L1940 1100 L-20 1100 Z" fill="url(#c-warm)"/>

  <!-- the mark (same geometry as brand/isotherm-logo.svg) -->
  <g filter="url(#shadow)">
    <svg x="170" y="250" width="440" height="440" viewBox="0 0 1024 1024">
      <g clip-path="url(#m-tile)">
        <rect width="1024" height="1024" fill="url(#m-cool)"/>
        <g fill="none" stroke="#25547D" stroke-width="20" stroke-linecap="round">
          <path d="M-40 370 C190 300 330 420 512 420 S840 350 1064 390"/>
          <path d="M-40 200 C190 130 330 250 512 250 S840 180 1064 220"/>
        </g>
        <path d="M-40 540 C190 470 330 590 512 590 S840 520 1064 560 L1064 1064 L-40 1064 Z" fill="url(#m-warm)"/>
        <path d="M-40 760 C190 690 330 810 512 810 S840 740 1064 780" fill="none" stroke="#FFB466"
              stroke-opacity="0.55" stroke-width="20" stroke-linecap="round"/>
        <g fill="#FFF6E8">
          <rect x="430" y="117" width="164" height="620" rx="82"/>
          <circle cx="512" cy="761" r="146"/>
        </g>
        <g stroke="#173B5C" stroke-width="26" stroke-linecap="round">
          <line x1="474" y1="215" x2="550" y2="215"/>
          <line x1="474" y1="305" x2="550" y2="305"/>
          <line x1="474" y1="395" x2="550" y2="395"/>
          <line x1="474" y1="485" x2="550" y2="485"/>
        </g>
        <g fill="#E23B28">
          <circle cx="512" cy="761" r="92"/>
          <rect x="475" y="590" width="74" height="200"/>
        </g>
      </g>
    </svg>
  </g>

  <!-- wordmark and copy -->
  <g font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" fill="#FFF6E8">
    <text x="690" y="430" font-size="176" font-weight="600" letter-spacing="-3">Isotherm</text>
    <text x="696" y="520" font-size="50" font-weight="500" fill-opacity="0.9">Daily city-temperature strike ladders</text>
    <g font-size="38" font-weight="600" text-anchor="middle">
      <g>
        <rect x="696" y="568" width="208" height="76" rx="38" fill="#FFF6E8" fill-opacity="0.07" stroke="#FFF6E8" stroke-opacity="0.45" stroke-width="3"/>
        <text x="800" y="619">≥ 28 °C</text>
      </g>
      <g>
        <rect x="928" y="568" width="208" height="76" rx="38" fill="#FFF6E8" fill-opacity="0.07" stroke="#FFF6E8" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1032" y="619">≥ 29 °C</text>
      </g>
      <g>
        <rect x="1160" y="568" width="208" height="76" rx="38" fill="#FFF6E8" fill-opacity="0.07" stroke="#FFF6E8" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1264" y="619">≥ 30 °C</text>
      </g>
      <g>
        <rect x="1392" y="568" width="208" height="76" rx="38" fill="#FFF6E8" fill-opacity="0.07" stroke="#FFF6E8" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1496" y="619">≥ 31 °C</text>
      </g>
    </g>
    <text x="696" y="722" font-size="32" font-weight="500" fill-opacity="0.75">One onchain order book per strike · settled from airport METAR reports</text>
  </g>
  <text x="960" y="1012" text-anchor="middle" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="600" fill="#0C2034">Testnet prototype · Monad testnet · faucet AUSD only · not financial advice</text>
</svg>
