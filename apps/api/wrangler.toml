name = "isotherm-api"
main = "src/index.ts"
compatibility_date = "2025-07-18"
# No public hostname of its own: the API is served at https://isotherm.pages.dev/api/* by the Pages Function in
# apps/web/functions/api/[[path]].ts through a service binding (binding "API" -> service "isotherm-api"). Service
# bindings and the cron trigger need no public route, so the default Workers subdomain and version preview URLs are off.
workers_dev = false
preview_urls = false

# Every minute: refill the relayer's AUSD float (faucet has a global 60 s cooldown) and advance the log scan.
[triggers]
crons = ["* * * * *"]

# Worker version id + upload (deploy) time, reported in /api/health `version` next to the build id
# (src/generated/build.json, written by scripts/build-info.mjs during `npm run prepare-data`).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "RELAYER"
class_name = "RelayerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayerDO"]

# KV namespace "isotherm-api-ISO_KV" (create it with: wrangler kv namespace create ISO_KV).
# The real id is account-specific and is NOT committed: `npm run deploy` (scripts/deploy.mjs) substitutes it
# from $ISO_KV_NAMESPACE_ID or ~/.config/isotherm/kv-namespace-id. preview_id is for wrangler dev.
[[kv_namespaces]]
binding = "ISO_KV"
id = "<KV_NAMESPACE_ID>"
preview_id = "isotherm-local-preview"

[vars]
# Monad testnet RPC endpoints, tried in this order through a viem fallback transport (src/rpc.ts). The official
# endpoint answers "requests limited to 15/sec" per client IP and Workers share egress IPs with other tenants, so it
# comes last. Every endpoint's eth_chainId must be 10143 before it is used. Each endpoint gets a client-side throttle
# of RPC_MAX_RPS requests/s; a rate-limited or failing endpoint cools down and the next one serves. Do not set
# RPC_URL here: it is the single-endpoint override for anvil forks (wrangler dev, the fork test) and wins over this list.
RPC_URLS = "https://rpc.ankr.com/monad_testnet,https://10143.rpc.thirdweb.com,https://testnet-rpc.monad.xyz"
RPC_MAX_RPS = "8"
CHAIN_ID = "10143"
ALLOWED_ORIGINS = "https://isotherm.pages.dev,https://*.isotherm.pages.dev,http://localhost:*,http://127.0.0.1:*"
DRIP_ENABLED = "1"
DRIP_MON = "0.25"
DRIP_AUSD = "1000"
DRIP_ADDRESS_COOLDOWN_H = "24"
AUSD_FLOAT_TARGET = "50000"
RELAY_ENABLED = "1"
RELAY_MIN_AUSD = "1"
RELAY_MAX_AUSD = "500"
# Permit-mode relays stay off: the v1 vault has EIP-3009 authorizations, and a permit can be redirected (review N10).
RELAY_ALLOW_PERMIT = "0"
GAS_MULTIPLIER_PCT = "108"
# Drip + relay POSTs per client network per minute, enforced in the Durable Object before any RPC work (exact).
POST_LIMIT_PER_MIN = "30"
# ---- MON budget (testnet MON is scarce). Sized by `node scripts/size-caps.mjs` from the relayer's LIVE balance,
# spread over a HORIZON of UTC days so one worst-case day can never take the whole balance (formula: apps/api/README.md).
#   JUDGING SIZING 2026-10-13T11:41Z (evidence/size-caps-2026-10-13-judging.txt): the relayer was funded to 102.424 MON
#   (+63 from the deployer, tx 0x4d7120db…7ca5) for a 19-day horizon through 2026-10-31; DRIP_MON 0.25 so one drip pays for
#   a first Buy YES, a first Buy NO, a Sell and a merge (0.229 MON at 102 gwei; 0.15 covered only Buy YES, then the app
#   refused Buy NO). `size-caps.mjs --days 19 --drip-mon 0.25 --drip-share 0.85`: spendable 102.324 -> 5.3855 MON/day;
#   dripCost 0.260175, relayCost 0.03417; DRIP_DAILY_CAP floor(5.3855 x 0.85 / 0.260175) = 17, RELAY_DAILY_CAP 28;
#   worst-case UTC day 5.380 <= 5.3855 and 19 such days 102.215 <= 102.324: Oct 13-31 are covered even at maximum use.
#   DRIP_PER_IP_PER_DAY is 5, not the script's floor(17/2) = 8: at 0.25 MON a drip, 8 would let one home network take
#   2 MON a day; 5 still covers a judging room sharing one network. The other per-network values are the script's.
#   Revert after 2026-10-31 (DRIP_MON 0.15 and a fresh size-caps run). Previous sizing: 2026-10-11, 39.79 MON, 9 / 26.
# Drips and relays never spend below RELAYER_MIN_MON (the reserve; only the AUSD-float cron refill may use it).
RELAYER_MIN_MON = "0.1"
DRIP_GAS_MON = "0.011"
RELAY_COST_MON = "0.035"
DRIP_DAILY_CAP = "17"
DRIP_PER_IP_PER_DAY = "5"
RELAY_DAILY_CAP = "28"
RELAY_PER_IP_PER_DAY = "14"
RELAY_PER_ADDRESS_PER_DAY = "14"
STATS_SCAN_MAX_WINDOWS = "20"
REAL_STATIONS = "RCSS,RJTT,ZGSZ,RKSI,VHHH"
# Wallets excluded from the public "non-maker" counts (deployments/testnet.json roles are added automatically).
MAKER_ADDRESSES = "0xd572638F07829D1c3636400FB73CF34Ca6c7448a"
# 0xd42A…D79c = the go-live smoke-test dev wallet (docs/evidence/golive), our own, so it is not a "trading wallet".
# 0xF4a3…2427 = the team's Dynamic embedded wallet (email login on the live site, 2026-10-07), our own as well.
# 0xfec0…C7D5 = the demo-video dev wallet (screen recordings, 2026-10-08), our own as well.
# 0xd3A6…4682 = the team's MetaMask Agent Wallet server wallet (signed-in mm plugin trade, 2026-10-08), our own as well.
# 0x1232…2CbF = the team's Dynamic Sandbox test-account wallet (Dynamic sign-in screen recording, 2026-10-09), our own as well.
# The stats classify at publish time from this list, so adding a wallet here also reclassifies its earlier fills.
TEAM_ADDRESSES = "0xb855f2bCA7C12Db2aA9D70740c6cF40808325c11,0x636D0598E416e5f66acD0F6Ac2Ae96306529b4d5,0x029049a9dA77231dd86A90E52Fd6Db542424e727,0xb0b9F5E93C4D4Bb448eC96191393bf35C9E8429f,0xd42A0b394F09df88BB2120D0973569b845f2D79c,0xF4a3377D1200584D8Ab7d7e64c6B17dc6c792427,0xfec06f14559e1Caa7e7649993f9394BE3F30C7D5,0xd3A60CD946f58D6A43412dB20b30D834B72b4682,0x12320262325e2DF351a7Ed5445F9548640852CbF"
